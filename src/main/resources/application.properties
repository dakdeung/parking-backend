spring.application.name=parking
server.port=${PORT:8080}

# ---------------------------------------------------------------------------
# Default profile: in-memory H2 (no setup needed). Use --spring.profiles.active=oracle
# to run against Oracle Cloud (see application-oracle.properties).
# LOCK_TIMEOUT lets concurrent bookings wait for the slot row lock instead of failing fast.
# ---------------------------------------------------------------------------
spring.datasource.url=jdbc:h2:mem:parking;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=10000
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# Jackson: ISO-8601 dates (money-as-string + fixed date format are set in JacksonConfiguration)
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null

# Swagger UI -> http://localhost:8080/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method

# Seed a demo lot (LOT-JKT01) and rate cards on start-up
parking.seed.enabled=true
