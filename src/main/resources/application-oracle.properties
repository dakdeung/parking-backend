# ---------------------------------------------------------------------------
# Oracle Cloud Free (Autonomous Database) profile.
# Activate with:  --spring.profiles.active=oracle   (or SPRING_PROFILES_ACTIVE=oracle)
#
# Required environment variables:
#   ORACLE_DB_URL       e.g. jdbc:oracle:thin:@parkdb_high?TNS_ADMIN=C:/oracle/Wallet_parkdb
#                       (wallet folder = unzipped "Instance Wallet" from the OCI console)
#   ORACLE_DB_USERNAME  e.g. ADMIN or a dedicated schema user
#   ORACLE_DB_PASSWORD
# Optional:
#   DDL_AUTO            update (default) | validate | none
#                       use "none" if you created the tables yourself with docs/oracle-schema.sql
# ---------------------------------------------------------------------------
spring.datasource.url=${ORACLE_DB_URL}
spring.datasource.username=${ORACLE_DB_USERNAME}
spring.datasource.password=${ORACLE_DB_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=30000

spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
